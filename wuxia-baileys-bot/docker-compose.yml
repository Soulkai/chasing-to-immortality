services:
  postgres:
    image: postgres:16-alpine
    container_name: wuxia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wuxia
      POSTGRES_PASSWORD: wuxia
      POSTGRES_DB: wuxia_game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
